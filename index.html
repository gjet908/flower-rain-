
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For You</title>
<meta name="description" content="A little something, just for you.">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cinematic layered background -->
  <div class="scene">

    <div class="bg-layer bg-glow" aria-hidden="true"></div>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div id="particles" class="particles-layer" aria-hidden="true"></div>
    <div id="darken-overlay" class="darken-overlay" aria-hidden="true"></div>

    <!-- Petals that drift behind the bouquet -->
    <div id="petal-rain-back" class="petal-rain petal-rain-back" aria-hidden="true"></div>

    <!-- Bouquet stage -->
    <div id="bouquet-wrap" class="bouquet-wrap">
      <svg id="bouquet" class="bouquet"
           viewBox="0 0 100 100"
           preserveAspectRatio="xMidYMid meet"
           xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="petalRose" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#F0C4CE"/>
            <stop offset="55%" stop-color="#D890A0"/>
            <stop offset="100%" stop-color="#B15E74"/>
          </radialGradient>
          <radialGradient id="petalBlush" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#FFF4E8"/>
            <stop offset="60%" stop-color="#F1BCC7"/>
            <stop offset="100%" stop-color="#D897A6"/>
          </radialGradient>
          <radialGradient id="petalIvory" cx="35%" cy="28%" r="75%">
            <stop offset="0%" stop-color="#FFFCF6"/>
            <stop offset="60%" stop-color="#FFF0DE"/>
            <stop offset="100%" stop-color="#E9C9A8"/>
          </radialGradient>
          <radialGradient id="flowerCenter" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#F3D9A4"/>
            <stop offset="60%" stop-color="#D8B878"/>
            <stop offset="100%" stop-color="#9C7C42"/>
          </radialGradient>
          <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#5C7A55"/>
            <stop offset="100%" stop-color="#33472E"/>
          </linearGradient>
          <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6C8A5E"/>
            <stop offset="100%" stop-color="#3B5233"/>
          </linearGradient>
          <linearGradient id="wrapperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#EFE0C3"/>
            <stop offset="100%" stop-color="#C9A46B"/>
          </linearGradient>
          <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#0B1020" flood-opacity="0.45"/>
          </filter>
        </defs>

        <!-- layering: leaves -> back flowers -> stems -> middle flowers -> front flowers -> wrapper -->
        <g id="leaves-layer"></g>
        <g id="flowers-back-layer"></g>
        <g id="stems-layer"></g>
        <g id="flowers-middle-layer"></g>
        <g id="flowers-front-layer"></g>
        <g id="wrapper-layer"></g>
      </svg>
    </div>

    <!-- Petals that drift in front of the bouquet -->
    <div id="petal-rain-front" class="petal-rain petal-rain-front" aria-hidden="true"></div>

    <!-- Text overlay -->
    <div class="text-stage" aria-hidden="false">
      <div id="intro-block" class="intro-block">
        <p id="intro-line" class="intro-line">A little something&hellip;</p>
        <p id="intro-line-2" class="intro-line intro-line-2">just for you.</p>
      </div>

      <h1 id="for-you" class="for-you">FOR YOU</h1>

      <h2 id="name-reveal" class="name-reveal" aria-label="FALAK"></h2>

      <div id="final-block" class="final-block">
        <p id="final-msg-1" class="final-msg">Because some people deserve flowers.</p>
        <p id="final-msg-2" class="final-msg final-msg-2">Just because they are them.</p>
      </div>
    </div>

    <p id="hint-text" class="hint-text">move your cursor around</p>

  </div>

  <!-- Music control -->
  <div id="music-control" class="music-control" role="button" tabindex="0" aria-label="Play music">
    <span id="music-icon" class="music-icon">&#9658;</span>
  </div>
  <audio id="bg-audio" loop preload="none" src="music.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
